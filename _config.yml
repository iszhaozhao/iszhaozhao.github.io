# Hexo 7.3.0 — 赵正的个人博客
# 站点信息从已发布的静态页恢复。

title: 赵正的个人博客
subtitle: ''
description: ''
keywords:
author: 赵正
language: zh-CN
timezone: Asia/Shanghai

url: https://iszhaozhao.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  # 去掉 index.html，链接形如 /2026/01/30/hello-world/
  trailing_index: false
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: []

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  auto_detect: false
  line_number: true
  tab_replace: ''
  wrap: true
  hljs: false
  exclude_languages: []
  language_attr: false
  line_threshold: 0
  first_line_number: always1
  strip_indent: true
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

index_generator:
  path: ''
  per_page: 0
  order_by: -date

archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false
  order_by: -date

category_generator:
  per_page: 0
  order_by: -date

tag_generator:
  per_page: 0
  order_by: -date

theme: Academia

marked:
  smartypants: false
  modifyAnchors: 0
  headerIds: true
  gfm: true
  breaks: false

deploy: {}

ignore: []
meta_generator: true
